<!DOCTYPE html>
<html lang="sv" class="cf-warm" style="color-scheme: light only;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4efe6">
  <title>ClientFlow – KYC-formulär</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=20260915kundformular-cond">
  <style>
    :root { color-scheme: light only; }
    html { color-scheme: light only; background: var(--app-bg, #f4efe6); }
    body {
      margin: 0;
      font-family: var(--body-font), Schibsted Grotesk, sans-serif;
      color: var(--title-text, #0f172a);
      background: linear-gradient(135deg, var(--app-bg, #f4efe6) 0%, var(--panel-2, #ebe4d8) 100%);
      min-height: 100vh;
      padding: 2rem 1.25rem 4rem;
      -webkit-font-smoothing: antialiased;
    }
    .kyc-pub-wrap { max-width: 760px; margin: 0 auto; }
    .kyc-pub-brand { text-align: center; margin-bottom: 1.25rem; }
    .kyc-pub-state {
      background: var(--card-bg, #fff);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 14px;
      padding: 1.75rem 1.5rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }
    .kyc-pub-state h1 { font-family: var(--title-font), Fraunces, serif; font-size: 1.25rem; margin: 0 0 .5rem; }
    .kyc-pub-state p { margin: 0; color: var(--text, #475569); }
    .kyc-pub-spin {
      width: 26px; height: 26px; margin: 0 auto 1rem;
      border-radius: 50%;
      border: 3px solid #c7d2fe;
      border-top-color: var(--accent, #4f46e5);
      animation: kyc-pub-spin .7s linear infinite;
    }
    @keyframes kyc-pub-spin { to { transform: rotate(360deg); } }
    .kyc-pub-shell {
      background: var(--card-bg, #fff);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 14px;
      padding: 1rem 1rem 1.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }
    .hidden { display: none !important; }
    .kyc-pub-flash {
      margin: 0 0 1rem;
      padding: .75rem 1rem;
      border-radius: 10px;
      font-size: .92rem;
    }
    .kyc-pub-flash--ok { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
    .kyc-pub-flash--err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  </style>
</head>
<body>
  <div class="kyc-pub-wrap">
    <header class="kyc-pub-brand">
      <strong style="font-family:var(--title-font),Fraunces,serif;font-size:1.35rem;letter-spacing:-0.02em;">ClientFlow</strong>
    </header>

    <div id="kyc-pub-loading" class="kyc-pub-state">
      <div class="kyc-pub-spin" aria-hidden="true"></div>
      <h1>Hämtar KYC-formulär…</h1>
      <p>Ett ögonblick.</p>
    </div>

    <div id="kyc-pub-error" class="kyc-pub-state hidden">
      <h1 id="kyc-pub-error-title">Länken fungerar inte</h1>
      <p id="kyc-pub-error-text">Be byrån skicka en ny länk.</p>
    </div>

    <div id="kyc-pub-done" class="kyc-pub-state hidden">
      <h1>Tack!</h1>
      <p id="kyc-pub-done-text">Era KYC-uppgifter är inskickade. Formuläret skickas vidare för BankID-signering.</p>
    </div>

    <div id="kyc-pub-form-wrap" class="kyc-pub-shell hidden">
      <div id="kyc-pub-flash" class="kyc-pub-flash hidden" role="status"></div>
      <div id="kyc-pub-form-root"></div>
    </div>
  </div>

  <script src="js/kyc-huvudman.js?v=1"></script>
  <script src="js/kyc-formular-public.js?v=1"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = String(params.get('token') || '').trim();
      const loadingEl = document.getElementById('kyc-pub-loading');
      const errorEl = document.getElementById('kyc-pub-error');
      const errorTitle = document.getElementById('kyc-pub-error-title');
      const errorText = document.getElementById('kyc-pub-error-text');
      const doneEl = document.getElementById('kyc-pub-done');
      const doneText = document.getElementById('kyc-pub-done-text');
      const formWrap = document.getElementById('kyc-pub-form-wrap');
      const formRoot = document.getElementById('kyc-pub-form-root');
      const flashEl = document.getElementById('kyc-pub-flash');

      function show(el) { el.classList.remove('hidden'); }
      function hide(el) { el.classList.add('hidden'); }

      function showError(title, text) {
        hide(loadingEl);
        hide(formWrap);
        hide(doneEl);
        errorTitle.textContent = title || 'Länken fungerar inte';
        errorText.textContent = text || 'Be byrån skicka en ny länk.';
        show(errorEl);
      }

      function flash(msg, ok) {
        flashEl.textContent = msg;
        flashEl.className = 'kyc-pub-flash ' + (ok ? 'kyc-pub-flash--ok' : 'kyc-pub-flash--err');
        show(flashEl);
      }

      if (!token) {
        showError('Länk saknas', 'Öppna länken ni fick från byrån.');
        return;
      }

      async function loadForm() {
        const res = await fetch('/api/kyc-formular/public/' + encodeURIComponent(token), {
          method: 'GET',
          headers: { Accept: 'application/json' },
          cache: 'no-store'
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 410) {
          showError('Länken har gått ut', data.error || 'Be byrån skicka en ny länk.');
          return null;
        }
        if (!res.ok) {
          showError('Kunde inte öppna formuläret', data.error || ('HTTP ' + res.status));
          return null;
        }
        return data;
      }

      async function save(action, answers, btn) {
        const orig = btn?.innerHTML;
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (action === 'mark_answered' ? 'Skickar…' : 'Sparar…');
        }
        try {
          const res = await fetch('/api/kyc-formular/public/' + encodeURIComponent(token), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ action, answers })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            flash(data.error || ('HTTP ' + res.status), false);
            return null;
          }
          return data;
        } finally {
          if (btn) { btn.disabled = false; btn.innerHTML = orig; }
        }
      }

      loadForm().then((data) => {
        hide(loadingEl);
        if (!data) return;
        if (data.answered || data.readOnly) {
          if (doneText && data.message) doneText.textContent = data.message;
          show(doneEl);
          return;
        }
        show(formWrap);
        window.KycFormularPublic.render(formRoot, data, {
          onSave: async (answers, btn) => {
            const result = await save('save', answers, btn);
            if (result) flash('Utkast sparat.', true);
          },
          onSubmit: async (answers, btn) => {
            const result = await save('mark_answered', answers, btn);
            if (!result) return;
            hide(formWrap);
            if (doneText) {
              doneText.textContent = result.message
                || 'Era KYC-uppgifter är inskickade. Formuläret skickas vidare för BankID-signering.';
            }
            show(doneEl);
          }
        });
      }).catch((e) => {
        showError('Kunde inte öppna formuläret', e.message || 'Nätverksfel');
      });
    })();
  </script>
</body>
</html>
