<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow • AI-användning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260828date2">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
      .ai-usage-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      .ai-usage-table th, .ai-usage-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }
      .ai-usage-table th { color: #475569; font-weight: 600; }
      .ai-usage-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .ai-usage-meta { color: #64748b; margin: 0 0 16px; }
      .ai-usage-grid { display: grid; gap: 20px; }
      @media (min-width: 960px) {
        .ai-usage-grid-2 { grid-template-columns: 1fr 1fr; }
      }
      .ai-usage-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar-container"></div>
        <main class="main-content">
            <div class="container">
                <header class="content-header risk-header">
                    <div class="risk-header-content">
                        <h1>AI-användning</h1>
                        <p class="dashboard-subtitle">Vilka användare och rutter som anropar OpenAI. Endast ClientFlowAdmin.</p>
                    </div>
                </header>

                <section class="dashboard-section">
                    <div class="dashboard-card">
                        <div class="dashboard-card-header">
                            <h2><i class="fas fa-robot"></i> Sammanställning</h2>
                            <label>
                                Period
                                <select id="ai-usage-days" aria-label="Antal dagar">
                                    <option value="7">7 dagar</option>
                                    <option value="14">14 dagar</option>
                                    <option value="30" selected>30 dagar</option>
                                </select>
                            </label>
                        </div>
                        <div class="dashboard-card-body">
                            <p class="ai-usage-meta" id="ai-usage-status">Laddar…</p>
                            <div class="ai-usage-grid ai-usage-grid-2">
                                <div>
                                    <h3>Per användare</h3>
                                    <div id="ai-usage-by-user"></div>
                                </div>
                                <div>
                                    <h3>Per route</h3>
                                    <div id="ai-usage-by-route"></div>
                                </div>
                            </div>
                            <h3 style="margin-top:24px;">Senaste anrop</h3>
                            <div id="ai-usage-recent"></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/config.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/components.js?v=2.2" defer></script>
    <script src="js/ai-usage.js?v=1" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
