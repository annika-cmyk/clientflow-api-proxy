<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow • Kundlista</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3.25">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="kundlista-page">

    <div class="app-container">
        <div class="sidebar-container"></div>

        <main class="main-content">
            <div class="container">

                <header class="content-header risk-header">
                    <div class="risk-header-content">
                        <h1>KUNDLISTA</h1>
                        <div class="risk-stats kundlista-riskaptit-stats">
                            <button type="button" class="stat-item riskaptit-stat" id="riskaptit-filter-btn" aria-pressed="false">
                                <i class="fas fa-exclamation-triangle text-warning"></i>
                                <span id="riskaptit-count">0</span> kunder kräver riskaptitbeslut
                            </button>
                        </div>
                    </div>
                </header>

                <div class="kundlista-toolbar">
                    <div class="kundlista-search">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-filter" placeholder="Sök på företagsnamn, organisationsnummer eller befattningshavare">
                    </div>
                    <span class="kundlista-count"><span id="total-count">0</span> kunder</span>
                    <button type="button" class="kundlista-add-btn" id="kundlista-add-btn" title="Lägg till företag" aria-label="Lägg till företag">
                        <i class="fas fa-plus" aria-hidden="true"></i>
                    </button>
                </div>
                <p id="kundlista-access-hint" class="kundlista-access-hint"></p>

                <div class="kundlista-statusfilter" id="status-filter" role="group" aria-label="Filtrera på status">
                    <button type="button" class="status-pill is-active" data-status="Lead">
                        <i class="fas fa-check"></i> Lead
                    </button>
                    <button type="button" class="status-pill is-active" data-status="Pågående kund">
                        <i class="fas fa-check"></i> Pågående kund
                    </button>
                    <button type="button" class="status-pill" data-status="Avslutad">
                        <i class="fas fa-check"></i> Avslutad
                    </button>
                </div>

                <div id="customer-list">
                    <div class="kundlista-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Laddar kunder...</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 ClientFlow. Alla rättigheter förbehållna.</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/components.js"></script>
    <script src="js/ai-chat.js?v=2.4"></script>
    <script src="js/hogrisk-sni.js?v=1.0"></script>
    <script src="app.js?v=2.4"></script>
    <script src="js/risk-skala.js?v=1"></script>
    <script src="js/kund-riskprofil.js?v=6"></script>
    <script src="js/riskaptit.js?v=2"></script>
    <script src="js/kund-compliance.js?v=1.3"></script>
    <script src="js/kundlista.js?v=2.8"></script>
</body>
</html>
