<!DOCTYPE html>
<html lang="sv" class="cf-warm" style="color-scheme: light only;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>ClientFlow – Boka möte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260915mot">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
      html.cf-warm body.boka-mote-page {
        min-height: 100vh;
        margin: 0;
        padding: 2.5rem 1.25rem 4rem;
        background: linear-gradient(160deg, var(--app-bg) 0%, var(--panel-2, #ebe4d8) 100%);
        font-family: var(--body-font), sans-serif;
        color: var(--title-text);
      }
      .boka-wrap { max-width: 560px; margin: 0 auto; }
      .boka-brand { text-align: center; margin-bottom: 1.5rem; }
      .boka-brand img { max-width: 150px; height: auto; }
      .boka-card {
        background: var(--card-bg, #fff);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.5rem 1.6rem;
        box-shadow: 0 4px 20px rgba(0,0,0,.06);
      }
      .boka-card h1 {
        font-family: var(--title-font), Georgia, serif;
        font-size: 1.45rem;
        margin: 0 0 .5rem;
        font-weight: 500;
      }
      .boka-lead { color: var(--text); margin: 0 0 1.1rem; line-height: 1.5; }
      .boka-meta { font-size: .9rem; color: var(--text); margin: 0 0 1rem; }
      .boka-slots { display: grid; gap: .5rem; margin: 1rem 0 1.25rem; }
      .boka-slot {
        display: flex; align-items: center; gap: .75rem;
        width: 100%; text-align: left;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 10px;
        padding: .8rem 1rem;
        cursor: pointer;
        font: inherit;
      }
      .boka-slot:hover { border-color: var(--accent); }
      .boka-slot.is-selected {
        border-color: var(--accent);
        background: var(--accent-light, #e7f0f2);
      }
      .boka-slot-radio {
        width: 1rem; height: 1rem; border-radius: 50%;
        border: 2px solid var(--border); flex: 0 0 auto;
      }
      .boka-slot.is-selected .boka-slot-radio {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 3px var(--accent);
      }
      .boka-field { display: grid; gap: .35rem; margin-bottom: .85rem; }
      .boka-field span { font-size: .85rem; font-weight: 600; }
      .boka-field input, .boka-field textarea {
        width: 100%; box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: .65rem .75rem;
        font: inherit;
        background: #fff;
      }
      .boka-actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
      .boka-error { color: var(--error, #b42318); font-size: .9rem; margin-top: .75rem; }
      .boka-state { text-align: center; padding: 1rem 0; color: var(--text); }
      .boka-state h2 { font-family: var(--title-font); font-weight: 500; color: var(--title-text); }
      .boka-ok { color: var(--success, #1f7a4d); }
      .hidden { display: none !important; }
    </style>
</head>
<body class="boka-mote-page">
    <div class="boka-wrap">
        <div class="boka-brand">
            <img src="images/Clientflow logga.png" alt="ClientFlow" onerror="this.style.display='none'">
        </div>

        <div id="boka-loading" class="boka-card boka-state">
            <p><i class="fas fa-spinner fa-spin"></i> Laddar tider...</p>
        </div>

        <div id="boka-error" class="boka-card boka-state hidden">
            <h2>Kunde inte öppna länken</h2>
            <p id="boka-error-text">Länken är ogiltig eller har gått ut.</p>
        </div>

        <div id="boka-done" class="boka-card boka-state hidden">
            <h2 class="boka-ok">Tack – tiden är bokad</h2>
            <p id="boka-done-text"></p>
        </div>

        <div id="boka-closed" class="boka-card boka-state hidden">
            <h2>Inbjudan är stängd</h2>
            <p>Det går inte längre att boka via den här länken.</p>
        </div>

        <div id="boka-form-wrap" class="boka-card hidden">
            <h1 id="boka-title">Boka möte</h1>
            <p class="boka-lead" id="boka-message"></p>
            <p class="boka-meta" id="boka-meta"></p>

            <form id="boka-form">
                <p style="font-weight:600;margin:0 0 .4rem;">Välj tid</p>
                <div class="boka-slots" id="boka-slots" role="radiogroup" aria-label="Tidsluckor"></div>

                <label class="boka-field">
                    <span>Ditt namn</span>
                    <input type="text" id="boka-name" required autocomplete="name">
                </label>
                <label class="boka-field">
                    <span>E-post (valfritt)</span>
                    <input type="email" id="boka-email" autocomplete="email">
                </label>
                <label class="boka-field">
                    <span>Meddelande (valfritt)</span>
                    <textarea id="boka-note" rows="2"></textarea>
                </label>

                <div class="boka-actions">
                    <button type="submit" class="btn btn-primary" id="boka-submit">Boka tid</button>
                </div>
                <p class="boka-error hidden" id="boka-form-error"></p>
            </form>
        </div>
    </div>

    <script src="js/config.js" defer></script>
    <script src="js/boka-mote.js?v=1" defer></script>
</body>
</html>
