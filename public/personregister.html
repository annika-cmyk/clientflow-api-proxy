<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow • Personregister</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260828date">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="personregister-page">

    <div class="app-container">
        <div class="sidebar-container"></div>

        <main class="main-content">
            <div class="container">
                <header class="content-header risk-header">
                    <div class="risk-header-content">
                        <h1>Personregister</h1>
                        <p class="section-desc">Sök på personnummer eller organisationsnummer bland företrädare och verkliga huvudmän – även på dolda och avslutade kunder. Resultatet visar bolag och uppdrag under de senaste fem åren.</p>
                    </div>
                </header>

                <form id="personregister-form" class="personregister-search" autocomplete="off">
                    <label class="visually-hidden" for="personregister-q">Personnummer eller organisationsnummer</label>
                    <i class="fas fa-search" aria-hidden="true"></i>
                    <input
                        type="search"
                        id="personregister-q"
                        name="q"
                        inputmode="numeric"
                        placeholder="Personnummer eller organisationsnummer"
                        required
                    >
                    <button type="submit" class="btn btn-primary" id="personregister-submit">
                        <i class="fas fa-search"></i> Sök
                    </button>
                </form>

                <p id="personregister-status" class="personregister-status"></p>
                <div id="personregister-results"></div>
            </div>
        </main>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 ClientFlow. Alla rättigheter förbehållna.</p>
        </div>
    </footer>

    <script src="js/config.js?v=2.1" defer></script>
    <script src="js/auth.js?v=2.1" defer></script>
    <script src="js/navigation.js?v=2.1" defer></script>
    <script src="js/components.js?v=2.2" defer></script>
    <script src="js/ai-chat.js?v=2.4" defer></script>
    <script src="app.js?v=2.9" defer></script>
    <script src="js/personregister.js?v=1" defer></script>
</body>
</html>
