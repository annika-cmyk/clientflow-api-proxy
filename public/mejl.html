<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientFlow • Mejl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260913gmail-labels">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
      .mejl-layout { display: grid; grid-template-columns: 1fr; gap: 1.25rem; margin-top: 0.75rem; }
      @media (min-width: 960px) {
        .mejl-layout { grid-template-columns: minmax(280px, 360px) 1fr; align-items: start; }
      }
      .mejl-header-bar {
        display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: center;
        margin-top: 0.75rem; padding: 0.35rem 0;
      }
      .mejl-header-bar .mejl-hint { margin: 0; flex: 1 1 12rem; }
      .mejl-connect-actions { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; }
      .mejl-status-pill {
        display: inline-flex; align-items: center; gap: 0.35rem;
        font-size: 0.75rem; font-weight: 600; color: #166534;
        background: #dcfce7; border-radius: 999px; padding: 0.2rem 0.55rem;
      }
      .mejl-status-pill.is-off { color: #9a3412; background: #ffedd5; }
      .mejl-folders {
        display: flex; gap: 0.35rem; margin: 0 0 0.75rem; padding: 0;
        list-style: none;
      }
      .mejl-folder-btn {
        border: 1px solid transparent; background: transparent; color: #64748b;
        font: inherit; font-size: 0.92rem; font-weight: 600; padding: 0.35rem 0.7rem;
        border-radius: 8px; cursor: pointer;
      }
      .mejl-folder-btn:hover { color: #0f172a; background: #f1f5f9; }
      .mejl-folder-btn.is-active {
        color: #0f172a; background: #e2e8f0; border-color: #cbd5e1;
      }
      .mejl-list { display: flex; flex-direction: column; gap: 0.5rem; }
      .mejl-item {
        text-align: left; width: 100%; border: 1px solid #e2e8f0; background: #fff;
        border-radius: 10px; padding: 0.85rem 1rem; cursor: pointer;
        transition: border-color .15s, box-shadow .15s;
      }
      .mejl-item:hover, .mejl-item.is-active {
        border-color: #94a3b8; box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      }
      .mejl-item-top { display: flex; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.2rem; }
      .mejl-item-customer { font-weight: 700; color: #0f172a; font-size: 0.95rem; line-height: 1.3; }
      .mejl-item-from { font-weight: 500; color: #334155; font-size: 0.88rem; margin-bottom: 0.15rem; }
      .mejl-item-date { color: #94a3b8; font-size: 0.78rem; white-space: nowrap; }
      .mejl-item-subject { font-size: 0.86rem; color: #64748b; margin-bottom: 0.15rem; }
      .mejl-item-meta { font-size: 0.78rem; color: #64748b; }
      .mejl-item-snippet { font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem; }
      .mejl-detail-title { font-size: 1.05rem; color: #0f172a; line-height: 1.35; }
      .mejl-detail .mejl-item-subject { font-size: 0.95rem; color: #334155; margin: 0.35rem 0 0.5rem; }
      .mejl-detail {
        border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; min-height: 320px;
        padding: 1.25rem 1.4rem;
      }
      .mejl-detail-empty { color: #94a3b8; padding: 2rem 0.5rem; }
      .mejl-detail-body { white-space: pre-wrap; line-height: 1.55; color: #334155; margin-top: 1rem; }
      .mejl-detail-body.html-body { white-space: normal; }
      .mejl-toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-top: 0.5rem; }
      .mejl-compose {
        border: 1px solid #e2e8f0; border-radius: 12px; background: #fff;
        padding: 1.25rem 1.4rem; margin-top: 1rem;
      }
      .mejl-compose[hidden] { display: none !important; }
      .mejl-compose .form-grid { display: grid; gap: 0.75rem; }
      .mejl-compose textarea.form-input { min-height: 160px; resize: vertical; }
      .mejl-filter { min-width: 220px; }
      .mejl-hint { font-size: 0.85rem; color: #64748b; margin: 0.5rem 0 0; }
      .mejl-sync-status {
        font-size: 0.8rem; color: #64748b; margin: 0 0 0.55rem;
        display: flex; align-items: center; gap: 0.4rem; min-height: 1.1rem;
      }
      .mejl-sync-status[hidden] { display: none !important; }
      .btn-danger-outline {
        color: #b91c1c; border-color: #fecaca; background: #fff;
      }
      .btn-danger-outline:hover { background: #fef2f2; border-color: #f87171; }
      .mejl-labels {
        display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.35rem 0 0.15rem;
      }
      .mejl-label-chip {
        display: inline-flex; align-items: center; gap: 0.28rem;
        font-size: 0.72rem; font-weight: 600; color: #475569;
        background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px;
        padding: 0.12rem 0.45rem; max-width: 100%;
      }
      .mejl-label-chip i.fa-tag { font-size: 0.65rem; opacity: 0.7; }
      .mejl-label-chip.is-kunder {
        color: #1e3a5f; background: #e8eef6; border-color: #c5d4e8;
      }
      .mejl-label-chip.is-kunder-root {
        color: #334155; background: #e2e8f0; border-color: #cbd5e1;
      }
      .mejl-label-chip.is-system {
        color: #64748b; background: #f8fafc; font-weight: 500;
      }
      .mejl-label-remove {
        border: 0; background: transparent; color: inherit; cursor: pointer;
        padding: 0 0 0 0.1rem; line-height: 1; opacity: 0.65;
      }
      .mejl-label-remove:hover { opacity: 1; color: #b91c1c; }
      .mejl-labels-block {
        margin-top: 0.85rem; padding-top: 0.75rem; border-top: 1px solid #e2e8f0;
      }
      .mejl-labels-heading {
        font-size: 0.78rem; font-weight: 700; color: #64748b;
        text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.4rem;
      }
      .mejl-label-edit { margin-top: 0.65rem; }
      .mejl-label-edit-label {
        display: block; font-size: 0.82rem; font-weight: 600; color: #334155;
        margin-bottom: 0.3rem;
      }
      .mejl-label-edit-row {
        display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center;
      }
      .mejl-label-select { flex: 1 1 12rem; min-width: 0; max-width: 28rem; }
      .mejl-label-create-wrap {
        display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center;
        margin-top: 0.45rem;
      }
      .mejl-label-create-wrap[hidden] { display: none !important; }
      .mejl-label-create-wrap .form-input { flex: 1 1 12rem; min-width: 0; max-width: 28rem; }
      .mejl-label-link { margin-top: 0.85rem; padding-top: 0.75rem; border-top: 1px dashed #e2e8f0; }
      .mejl-match-pill {
        display: inline-flex; align-items: center; gap: 0.3rem;
        font-size: 0.72rem; font-weight: 600; padding: 0.15rem 0.5rem;
        border-radius: 6px; margin: 0.35rem 0 0.15rem;
      }
      .mejl-match-pill.is-link { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
      .mejl-match-pill.is-auto { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; }
      .mejl-label-link-row {
        display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; margin-top: 0.35rem;
      }
      .mejl-label-link-check {
        display: flex; align-items: flex-start; gap: 0.4rem;
        font-size: 0.82rem; color: #475569; margin-top: 0.45rem;
      }
      .mejl-label-link-check input { margin-top: 0.15rem; }
      .mejl-item .mejl-labels { margin-top: 0.3rem; }
      /* Global .btn { display:inline-flex } och .mejl-layout { display:grid } slår UA [hidden] */
      #mejl-connect-btn[hidden],
      #mejl-disconnect-btn[hidden],
      #mejl-refresh-btn[hidden],
      #mejl-compose-toggle[hidden],
      #mejl-toolbar[hidden],
      #mejl-main[hidden],
      #mejl-compose[hidden] { display: none !important; }
      #mejl-connect-btn.is-disabled,
      #mejl-connect-btn[aria-disabled="true"] {
        opacity: 0.55;
        cursor: not-allowed;
        filter: grayscale(0.2);
      }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar-container"></div>
        <main class="main-content">
            <div class="container">
                <header class="content-header risk-header">
                    <div class="risk-header-content">
                        <h1>Mejl</h1>
                        <p class="risk-header-sub">Kundmejl från Gmail under etiketten KUNDER</p>
                    </div>
                </header>

                <div id="mejl-connect" class="mejl-header-bar">
                    <span id="mejl-status-pill" class="mejl-status-pill is-off">Ej kopplad</span>
                    <div class="mejl-connect-actions">
                        <button type="button" class="btn btn-secondary btn-sm" id="mejl-connect-btn">
                            <i class="fab fa-google"></i> Koppla Gmail
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm" id="mejl-disconnect-btn" hidden>
                            Koppla från
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm" id="mejl-refresh-btn" hidden>
                            <i class="fas fa-sync"></i> Uppdatera
                        </button>
                        <button type="button" class="btn btn-primary btn-sm" id="mejl-compose-toggle" hidden>
                            <i class="fas fa-pen"></i> Nytt mejl
                        </button>
                    </div>
                    <p id="mejl-connect-text" class="mejl-hint">Laddar status…</p>
                </div>

                <div class="mejl-toolbar" id="mejl-toolbar" hidden>
                    <label class="mejl-filter">
                        <span class="sr-only">Filtrera kund</span>
                        <select id="mejl-customer-filter" class="form-select form-input">
                            <option value="">Alla matchade kunder</option>
                        </select>
                    </label>
                </div>

                <section class="mejl-compose" id="mejl-compose" hidden>
                    <h2 style="margin:0 0 0.75rem; font-size:1.05rem;">Nytt mejl</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="mejl-to">Till</label>
                            <input type="email" id="mejl-to" class="form-input" placeholder="kund@foretag.se">
                        </div>
                        <div class="form-group">
                            <label for="mejl-customer">Koppla till kund (etikett)</label>
                            <select id="mejl-customer" class="form-select form-input">
                                <option value="">Ingen</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="mejl-subject">Ämne</label>
                            <input type="text" id="mejl-subject" class="form-input" placeholder="Ämne">
                        </div>
                        <div class="form-group">
                            <label for="mejl-body">Meddelande</label>
                            <textarea id="mejl-body" class="form-input" placeholder="Skriv ditt mejl…"></textarea>
                        </div>
                    </div>
                    <div class="mejl-connect-actions" style="margin-top:0.9rem;">
                        <button type="button" class="btn btn-primary" id="mejl-send-btn">
                            <i class="fas fa-paper-plane"></i> Skicka via Gmail
                        </button>
                        <button type="button" class="btn btn-secondary" id="mejl-compose-cancel">Avbryt</button>
                        <span id="mejl-send-status" class="mejl-hint"></span>
                    </div>
                </section>

                <div class="mejl-layout" id="mejl-main" hidden>
                    <section>
                        <nav class="mejl-folders" aria-label="Mappar">
                            <button type="button" class="mejl-folder-btn is-active" data-folder="inbox" id="mejl-folder-inbox">Inkorg</button>
                            <button type="button" class="mejl-folder-btn" data-folder="sent" id="mejl-folder-sent">Skickat</button>
                        </nav>
                        <p id="mejl-sync-status" class="mejl-sync-status" hidden></p>
                        <div id="mejl-list" class="mejl-list">
                            <p class="mejl-hint">Laddar mejl…</p>
                        </div>
                    </section>
                    <section>
                        <div id="mejl-detail" class="mejl-detail">
                            <p class="mejl-detail-empty">Välj ett mejl till vänster.</p>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/components.js?v=2.2" defer></script>
    <script src="js/mejl.js?v=20260913labellink" defer></script>
</body>
</html>
